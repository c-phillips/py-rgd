[project]
name = "py-rgd"
version = "0.1.0"
description = "RGD Parser for Python"
readme = "README.md"
authors = [
    { name = "Collin Phillips", email = "collinp1024@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lark>=1.3.1",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.optional-dependencies]
networkx = [
    "networkx>=3.6.1"
]
pyg = [
    "torch>=2.11.0",
    "torch-geometric",
]

[project.scripts]
rgd = "rgd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rgd"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
